<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELA.6.R.1.4 Poetic Forms and Meaning - FAST Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#172554;--bg:#eaf1fb;--line:#c9d6ea;--teal:#0d9488;--sun:#facc15}
*{box-sizing:border-box}body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 40px}
header{background:var(--ink);color:#fff;border-radius:16px;padding:22px;margin-bottom:14px}
header h1{margin:0 0 4px;font-size:clamp(1.3rem,4vw,1.9rem)}header p{margin:0;opacity:.85;font-size:.9rem}
main{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
details{background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}summary{cursor:pointer;font-weight:700}
ol{padding-left:22px}li{margin:4px 0}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pass{background:#fffbea;border:1px solid #f3e3a1;border-left:6px solid var(--sun);border-radius:8px;padding:14px 16px;margin:10px 0}
.pass h4{margin:0 0 8px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;margin-top:10px}
.meta{font-size:.85rem;opacity:.7;margin:12px 0 0}.opts{display:grid;gap:8px;margin:8px 0 14px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px}
.opt:hover:not(:disabled){border-color:var(--teal)}.opt.sel{border-color:var(--ink);background:#e0e7ff}
.opt.ok{background:#dcfce7;border-color:#16a34a}.opt.no{background:#fee2e2;border-color:#dc2626}
.fb{border-radius:8px;padding:10px;margin:8px 0}.fb.ok{background:#dcfce7}.fb.no{background:#fef9c3}.done{text-align:center}
</style></head><body><div class="wrap">
<header><h1>Poetic Forms and Meaning</h1><p>ELA.6.R.1.4: Describe the impact of various poetic forms on meaning and style.<br>Tier 1 FAST-style practice</p></header>
<main aria-live="polite"><details><summary>Strategy reminder</summary><p id="goal"></p><ol id="steps"></ol></details>
<div class="pass" id="pass"></div><div id="prac"></div></main></div>
<script>
/* ===== EDIT CONTENT HERE: goal, steps, p (passage), qs. Each question has parts: q, o (choices), a (answer text, or a list for Select TWO) ===== */
const L={"goal": "Explain how a poem's form (lines, rhyme, rhythm, and pattern) shapes its meaning and style.", "steps": ["Name each form: count the lines and check for rhyme and pattern.", "Ask what the form makes the reader notice or feel.", "Use a line from the poem as evidence."], "p": "<h4>Poem A: \"Before Sunrise\"</h4>The bakery lights come on at four,<br>before the street remembers it has a name.<br>Flour rises like small weather.<br>Somewhere an oven door groans open,<br>and the whole block smells like morning<br>making a promise.<br>No one is awake to hear it,<br>but the bread keeps its own time anyway.<h4 style=\"margin-top:14px\">Poem B: \"Ned's Dough\"</h4>A baker named Ned, in a rush,<br>Mixed salt in the dough with a push.<br>The loaves came out gray,<br>The ducks walked away,<br>And the town chewed the whole thing to mush.", "qs": [{"e": "Poem A has no set rhyme scheme or line pattern, so it is free verse.", "parts": [{"q": "What form is Poem A?", "a": "Free verse", "o": ["Free verse", "Limerick", "Haiku", "Ballad"]}]}, {"e": "Free verse sounds like quiet, natural speech, which matches the calm mood.", "parts": [{"q": "How does the form of Poem A help create its meaning?", "a": "The relaxed, flowing lines make the early morning feel calm and natural", "o": ["The relaxed, flowing lines make the early morning feel calm and natural", "The strict rhyme scheme makes the poem funny", "The short lines force readers to count syllables", "The repeating pattern shows the baker is in a hurry"]}]}, {"e": "The silly detail of the ducks leaving, paired with the rhyme, creates humor.", "parts": [{"q": "What is the effect of the form of Poem B?", "a": "The rhyme and bouncy rhythm make the story funny and quick", "o": ["The rhyme and bouncy rhythm make the story funny and quick", "The unrhymed lines make the story serious", "The long lines slow the poem for deep thought", "The free verse shows the baker is tired"]}, {"q": "Which detail from Poem B best shows the humor?", "a": "The ducks walked away,", "o": ["The ducks walked away,", "Mixed salt in the dough with a push.", "The loaves came out gray,", "A baker named Ned, in a rush,"]}]}, {"e": "Limericks have five lines and an AABBA rhyme scheme.", "parts": [{"q": "Which TWO features make Poem B a limerick?", "a": ["It has five lines", "Its rhyme pattern is AABBA"], "o": ["It has five lines", "Its rhyme pattern is AABBA", "It has no rhyme", "It follows a 5-7-5 syllable pattern", "All its lines are unrhymed"]}]}, {"e": "The forms create different styles: reflective free verse and a playful limerick.", "parts": [{"q": "How do the styles of the two poems differ?", "a": "Poem A is calm and reflective, while Poem B is playful and bouncy", "o": ["Poem A is calm and reflective, while Poem B is playful and bouncy", "Poem A is funny, while Poem B is serious", "Both poems are playful and bouncy", "Poem A rhymes, while Poem B has no pattern"]}]}, {"e": "These lines show the work goes on quietly, unseen.", "parts": [{"q": "What does Poem A suggest about the bakery?", "a": "Quiet work can feel special even when no one notices", "o": ["Quiet work can feel special even when no one notices", "Bakers should sleep late", "Mornings are noisy and stressful", "Bread is hard to make"]}, {"q": "Which lines best support your answer to Part A?", "a": "No one is awake to hear it, / but the bread keeps its own time anyway.", "o": ["No one is awake to hear it, / but the bread keeps its own time anyway.", "The bakery lights come on at four,", "Flour rises like small weather.", "Somewhere an oven door groans open,"]}]}]};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=L.qs;let score=0,missed=[];
$('goal').textContent=L.goal;$('steps').innerHTML=L.steps.map(s=>'<li>'+s+'</li>').join('');$('pass').innerHTML=L.p;
function show(i){
  const it=Q[i],multi=p=>Array.isArray(p.a);let locked=false;
  it.parts.forEach(p=>p.s=shuffle(p.o));const sel=it.parts.map(()=>new Set());
  $('prac').innerHTML='<p class="meta">Question '+(i+1)+' of '+Q.length+'</p>'+(it.c?'<div class="pass">'+it.c+'</div>':'')+
   it.parts.map((p,k)=>'<p><b>'+(it.parts.length>1?'Part '+'AB'[k]+': ':'')+p.q+'</b>'+(multi(p)?' <i>(Select TWO.)</i>':'')+'</p><div class="opts" data-k="'+k+'">'+p.s.map((o,j)=>'<button class="opt" data-j="'+j+'">'+o+'</button>').join('')+'</div>').join('')+'<div id="fb"></div><button class="btn" id="go">Submit answer</button>';
  document.querySelectorAll('.opts').forEach(g=>{const k=+g.dataset.k,p=it.parts[k],s=sel[k];
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const j=+b.dataset.j;
      if(multi(p)){s.has(j)?s.delete(j):(s.size<2&&s.add(j))}else{s.clear();s.add(j)}
      g.querySelectorAll('.opt').forEach((x,m)=>x.classList.toggle('sel',s.has(m)))})});
  $('go').onclick=()=>{
    if(locked){if(i+1<Q.length)show(i+1);else end();return}
    if(it.parts.some((p,k)=>sel[k].size!==(multi(p)?2:1))){$('fb').innerHTML='<div class="fb no">Answer every part before you submit.</div>';return}
    locked=true;let all=true;
    it.parts.forEach((p,k)=>{const ans=multi(p)?p.a:[p.a];
      const picked=[...sel[k]].map(j=>p.s[j]);if(!(picked.length===ans.length&&picked.every(x=>ans.includes(x))))all=false;
      document.querySelectorAll('.opts')[k].querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;b.classList.remove('sel');
        if(ans.includes(p.s[j]))b.classList.add('ok');else if(sel[k].has(j))b.classList.add('no')})});
    if(all)score++;else missed.push(i+1);
    $('fb').innerHTML='<div class="fb '+(all?'ok':'no')+'">'+(all?'✓ Correct! ':'✗ Not quite. ')+it.e+'</div>';
    $('go').textContent=i+1<Q.length?'Next question':'See my results';
  };
}
function end(){$('prac').innerHTML='<div class="done"><h3>Practice complete</h3><p><b>'+score+' of '+Q.length+'</b> correct.</p><p>'+(missed.length?'Review question'+(missed.length>1?'s ':' ')+missed.join(', ')+' and look back at the passage for evidence.':'You got every question right!')+'</p><button class="btn" id="rt">Try again</button></div>';
  $('rt').onclick=()=>{score=0;missed=[];show(0)}}
show(0);
</script></body></html>
